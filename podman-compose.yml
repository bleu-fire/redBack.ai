
services:
  mongodb:
    image: docker.io/library/mongo:7.0
    container_name: redback_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: redback_db
    volumes:
      - mongodb_data:/data/db:Z

  # Optional: Web UI to view database & users in your browser (http://localhost:8081)
  mongo-express:
    image: docker.io/library/mongo-express:latest
    container_name: redback_mongo_express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      - mongodb

volumes:
  mongodb_data:

